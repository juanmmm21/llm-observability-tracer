[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-observability-tracer"
version = "0.1.0"
description = "LLM observability: hierarchical spans, token costs and an HTML flame graph."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan Martos Cuevas", email = "martoscuevasjuan@gmail.com" }]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
dev = ["pytest>=8", "ruff>=0.6", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]

[tool.hatch.build.targets.wheel]
packages = ["llm_observability_tracer"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
