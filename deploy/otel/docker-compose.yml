# Traces from llm-observability-tracer, over OTLP, in Jaeger (default) or Grafana Tempo.
#
#   docker compose -f deploy/otel/docker-compose.yml up -d            # Jaeger UI: http://localhost:16686
#   docker compose -f deploy/otel/docker-compose.yml --profile tempo up -d
#                                                                    # + Grafana with Tempo: http://localhost:3000
#
# OTLP/HTTP endpoints for the tracer: Jaeger http://localhost:4318/v1/traces,
# Tempo http://localhost:4328/v1/traces.
services:
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI and query API
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"     # Tempo API
      - "4328:4318"     # OTLP HTTP
    profiles: ["tempo"]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/tempo.yaml:ro
    ports:
      - "3000:3000"
    depends_on: [tempo]
    profiles: ["tempo"]
